version: "3.3"

services:

  postgres:
    image: postgres:15-alpine
    container_name: restaurant-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    networks:
      - restaurant-backend
  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:latest
    container_name: restaurant-postgres-exporter
    restart: unless-stopped

    environment:
      DATA_SOURCE_NAME: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?sslmode=disable"

    depends_on:
      - postgres

    networks:
      - restaurant-backend


  cadvisor:
    image: gcr.io/cadvisor/cadvisor:latest
    container_name: restaurant-cadvisor
    restart: unless-stopped

    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro

    networks:
      - restaurant-monitoring


  prometheus:
    image: prom/prometheus:latest
    container_name: restaurant-prometheus
    restart: unless-stopped

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro

    ports:
      - "9090:9090"

    depends_on:
      - restaurant-app
      - postgres-exporter
      - cadvisor

    networks:
      - restaurant-frontend
      - restaurant-backend
      - restaurant-monitoring


  grafana:
    image: grafana/grafana:latest
    container_name: restaurant-grafana
    restart: unless-stopped

    ports:
      - "3001:3000"

    volumes:
      - grafana_data:/var/lib/grafana

    depends_on:
      - prometheus

    networks:
      - restaurant-monitoring


  restaurant-app:
    build: ./app
    container_name: restaurant-app
    restart: unless-stopped

    environment:
      DB_HOST: postgres
      DB_NAME: ${POSTGRES_DB}
      DB_USER: ${POSTGRES_USER}
      DB_PASSWORD: ${POSTGRES_PASSWORD}

    depends_on:
      - postgres

    expose:
      - "3000"
    security_opt:
      - no-new-privileges:true  
    networks:
      - restaurant-frontend
      - restaurant-backend


  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: restaurant-pgadmin
    restart: unless-stopped

    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}

    depends_on:
      - postgres

    ports:
      - "5050:80"

    networks:
      - restaurant-backend

  nginx:
    image: nginx:1.27-alpine
    container_name: restaurant-nginx
    restart: unless-stopped

    depends_on:
      - restaurant-app

    ports:
      - "80:80"

    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro

    networks:

      - restaurant-frontend

  loki:
    image: grafana/loki:2.9.8
    container_name: restaurant-loki
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml

    volumes:
      - ./loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki

    expose:
      - "3100"

    networks:
      - restaurant-monitoring

  promtail:
    image: grafana/promtail:2.9.8
    container_name: restaurant-promtail
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml

    volumes:
      - ./promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro

    depends_on:
      - loki

    networks:
      - restaurant-monitoring
volumes:
  postgres_data:
  grafana_data:
  loki_data:

networks:

  restaurant-frontend:

  restaurant-backend:

  restaurant-monitoring:



